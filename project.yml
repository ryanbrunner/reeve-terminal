name: Reeve
options:
  bundleIdPrefix: com.ryanbrunner
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ReeveKit:
    path: ReeveKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.11.2"
targets:
  Reeve:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: ReeveKit
        product: ReeveKit
      - package: SwiftTerm
        product: SwiftTerm
      # `reeve`, in Contents/Helpers: Contents/MacOS already has `Reeve`,
      # which a case-insensitive disk takes for the same name.
      - target: ReeveCLI
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanbrunner.reeve-terminal
        PRODUCT_NAME: Reeve
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reeve
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Ryan Brunner"
        # Each card runs a login shell and `claude` in it, which the App
        # Sandbox would not allow. Signed to run locally until there is a
        # release to sign properly.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        COMBINE_HIDPI_IMAGES: YES
  # The command line, from the same sources SwiftPM builds it from
  # (`cd ReeveKit && swift build`).
  ReeveCLI:
    type: tool
    platform: macOS
    sources:
      - path: ReeveKit/Sources/reeve
    dependencies:
      - package: ReeveKit
        product: ReeveKit
    settings:
      base:
        PRODUCT_NAME: reeve
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
