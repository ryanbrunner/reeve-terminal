name: Reeve
options:
  bundleIdPrefix: com.ryanbrunner
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
packages:
  ReeveKit:
    path: ReeveKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.11.2"
targets:
  Reeve:
    type: application
    platform: macOS
    # Synced folders: Xcode lists their files itself, so files added or
    # renamed show up without running xcodegen again.
    sources:
      - path: App/Sources
        type: syncedFolder
      - path: App/Resources
        buildPhase: resources
    # The Preview tab shows dev servers, often plain http on a name other than
    # localhost, which App Transport Security would refuse.
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    dependencies:
      - package: ReeveKit
        product: ReeveKit
      - package: SwiftTerm
        product: SwiftTerm
      # `reeve`, in Contents/Helpers: Contents/MacOS already has `Reeve`,
      # which a case-insensitive disk takes for the same name.
      - target: ReeveCLI
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanbrunner.reeve-terminal
        PRODUCT_NAME: Reeve
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reeve
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Ryan Brunner"
        # Each card runs a login shell and `claude` in it, which the App
        # Sandbox would not allow, so Reeve can't go through the App Store
        # or TestFlight. Debug is signed to run locally; Release is signed
        # with Developer ID and notarized by script/release.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: X4GUBP555N
          ENABLE_HARDENED_RUNTIME: YES
  # The command line, from the same sources SwiftPM builds it from
  # (`cd ReeveKit && swift build`).
  ReeveCLI:
    type: tool
    platform: macOS
    sources:
      - path: ReeveKit/Sources/reeve
        type: syncedFolder
    dependencies:
      - package: ReeveKit
        product: ReeveKit
    settings:
      base:
        PRODUCT_NAME: reeve
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: X4GUBP555N
          ENABLE_HARDENED_RUNTIME: YES
